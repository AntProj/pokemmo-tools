name: Aggregate trainer contributions

# Once a day (and on demand): pull community Trainer Scribe contributions from
# R2, consensus-merge them into the trainerInstances catalogs, commit, and
# redeploy the site so everyone gets the updated data.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trainer-data
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_CONTRIB_BUCKET: ${{ secrets.R2_CONTRIB_BUCKET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The aggregator validates species/moves against the dataset.
      - run: npm run build:data

      - name: Fetch contributions from R2
        run: node scripts/fetch-contributions.mjs --out=data/contributions

      - name: Consensus-merge each region
        run: |
          for r in sinnoh johto; do
            if [ -f "public/data/maps/$r/trainer-instances.json" ]; then
              node scripts/aggregate-contributions.mjs --dir=data/contributions --region="$r" --min-sources=2
            fi
          done

      - name: Commit updated catalogs
        run: |
          git config user.name "pokemmo-tools-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data/maps/*/trainer-instances.json
          if git diff --cached --quiet; then
            echo "No catalog changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: aggregate community trainer contributions [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      # Republish so the live site (and desktop apps fetching from it) get the
      # updated catalogs. Reuses the project's deploy script.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        run: npm run deploy
