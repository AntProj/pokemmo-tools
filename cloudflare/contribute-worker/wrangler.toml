name = "pokemmo-trainer-contribute"
main = "src/index.js"
compatibility_date = "2024-11-01"

# R2 bucket the contributions are written to. Create it once:
#   npx wrangler r2 bucket create pokemmo-trainer-contributions
# The daily GitHub Action reads the same bucket via the S3 API.
[[r2_buckets]]
binding = "CONTRIB"
bucket_name = "pokemmo-trainer-contributions"

# Optional anti-spam shared secret (not committed):
#   npx wrangler secret put CONTRIB_KEY
# When set, the Scribe must send the same value in the X-Scribe-Key header.
