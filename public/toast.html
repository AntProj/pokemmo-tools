<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title></title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #toast {
    box-sizing: border-box;
    height: 100%;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    border-radius: 12px;
    background: #1c1917;
    border: 1px solid #44403c;
    box-shadow: 0 8px 28px rgba(0,0,0,0.5);
    color: #f5f5f4;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity .14s ease, transform .14s ease;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; background: #10b981; }
  #toast.warn #dot { background: #f59e0b; }
  #msg { font-size: 14px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div id="toast"><span id="dot"></span><span id="msg"></span></div>
  <script>
    let hideTimer = null;
    let audioCtx = null;

    function beep(ok) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = ok ? 880 : 330;
        o.connect(g); g.connect(audioCtx.destination);
        const t = audioCtx.currentTime;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.20);
        o.start(t); o.stop(t + 0.22);
      } catch (_) {}
    }

    // Called from Rust via eval(). The main window also plays its own beep, so
    // this one is a best-effort fallback in case that context is locked.
    window.showToast = function (text, ok) {
      const el = document.getElementById('toast');
      document.getElementById('msg').textContent = text;
      el.classList.toggle('warn', !ok);
      // force reflow so the transition replays on repeat captures
      void el.offsetWidth;
      el.classList.add('show');
      beep(!!ok);
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => el.classList.remove('show'), 1400);
    };
  </script>
</body>
</html>
